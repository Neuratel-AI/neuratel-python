[project]
name = "neuratelai"
version = "0.2.0"
description = "Official Python SDK for the Neuratel API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Neuratel AI", email = "dev@neuratel.ai" }]
requires-python = ">=3.10"
keywords = ["neuratelai", "neuratel", "voice-ai", "telephony", "sdk", "ai-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic[email]>=2.0",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
cli = [
  "typer>=0.15",
  "rich>=13.0",
]


[project.urls]
Homepage = "https://neuratel.ai"
Documentation = "https://docs.neuratel.ai"
Repository = "https://github.com/Neuratel-AI/neuratel-python"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.4",
  "mypy>=1.10",
  "datamodel-code-generator>=0.31",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["src/neuratelai/types/_generated\\.py$"]

# Auto-generated Pydantic models from openapi.json — codegen artifacts
# don't pass strict mode and are regenerated on each release.
[[tool.mypy.overrides]]
module = "neuratelai.types._generated"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
