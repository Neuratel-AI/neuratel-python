name: Regenerate Types

on:
  workflow_dispatch:

jobs:
  regenerate:
    name: Regenerate SDK types from latest spec
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Regenerate types
        run: uv run bash scripts/generate_types.sh

      - name: Lint check
        run: uv run ruff check src/

      - name: Run tests
        run: uv run pytest -q

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/neuratelai/types/_generated.py
          if git diff --cached --quiet; then
            echo "No type changes to commit"
          else
            git commit -m "chore: regenerate types from latest OpenAPI spec"
            git push
          fi
